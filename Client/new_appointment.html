<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Schedule Appointment</title>
  <link rel="stylesheet" href="new_appointment.css">
</head>
<body>
  <main class="form-container">
    <button id="closeButton" class="close-button" type="button" aria-label="Close">
      &times;
    </button>

    <h1>Schedule Appointment</h1>

    <form id="appointmentForm">
      <div class="form-group">
        <label for="patientNum">Patient</label>
        <select id="patientNum" required disabled>
          <option value="">Loading patients...</option>
        </select>
        <small>Select an existing patient by initials and patient number.</small>
      </div>

      <div class="form-group">
        <label for="appointmentDate">Appointment Date</label>
        <input id="appointmentDate" type="date" required>
      </div>

      <div class="form-group">
        <label for="startTime">Start Time</label>
        <input id="startTime" type="time" required>
      </div>

      <div class="form-group">
        <label for="appointmentType">Appointment Type</label>
        <input id="appointmentType" type="text" maxlength="100">
      </div>

      <div class="form-group">
        <label for="appointmentNotes">Notes</label>
        <textarea id="appointmentNotes" rows="5"></textarea>
      </div>

      <button id="submitButton" class="submit-button" type="submit" disabled>
        Create Appointment
      </button>
    </form>
  </main>

  <script>
    const APPOINTMENTS_URL = "http://127.0.0.1:8000/appointments";
    const PATIENTS_URL = "http://127.0.0.1:8000/patients";

    document.getElementById("closeButton").addEventListener("click", () => {
      window.location.href = "index.html";
    });

    async function loadPatients() {
      const patientSelect = document.getElementById("patientNum");
      const submitButton = document.getElementById("submitButton");

      try {
        const response = await fetch(PATIENTS_URL);

        if (!response.ok) {
          throw new Error("Could not load patients.");
        }

        const patients = await response.json();
        patientSelect.innerHTML = "";

        if (patients.length === 0) {
          const emptyOption = document.createElement("option");
          emptyOption.value = "";
          emptyOption.textContent = "No patients available";
          patientSelect.appendChild(emptyOption);
          return;
        }

        const placeholder = document.createElement("option");
        placeholder.value = "";
        placeholder.textContent = "Select a patient";
        patientSelect.appendChild(placeholder);

        patients
          .sort((first, second) => first.patient_num - second.patient_num)
          .forEach(patient => {
            const option = document.createElement("option");
            option.value = patient.patient_num;
            option.textContent = `${patient.initials} — Patient #${patient.patient_num}`;
            patientSelect.appendChild(option);
          });

        patientSelect.disabled = false;
        submitButton.disabled = false;
      } catch (error) {
        console.error("Error loading patients:", error);
        patientSelect.innerHTML = "";

        const errorOption = document.createElement("option");
        errorOption.value = "";
        errorOption.textContent = "Could not load patients";
        patientSelect.appendChild(errorOption);

        alert("Could not load patients. Check that the backend is running.");
      }
    }

    document.getElementById("appointmentForm").addEventListener("submit", async event => {
      event.preventDefault();

      const appointmentData = {
        patient_num: Number(document.getElementById("patientNum").value),
        appointment_date: document.getElementById("appointmentDate").value,
        start_time: document.getElementById("startTime").value,
        appointment_type: document.getElementById("appointmentType").value || null,
        notes: document.getElementById("appointmentNotes").value || null
      };

      try {
        const response = await fetch(APPOINTMENTS_URL, {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify(appointmentData)
        });

        const result = await response.json();

        if (!response.ok) {
          if (response.status === 404) {
            throw new Error(
              `Patient #${appointmentData.patient_num} does not exist.`
            );
          }

          throw new Error(result.detail || "Could not create appointment.");
        }

        alert("Appointment created successfully.");
        window.location.href = "index.html";
      } catch (error) {
        console.error("Error creating appointment:", error);
        alert(error.message || "Could not connect to the backend.");
      }
    });

    loadPatients();
  </script>
</body>
</html>
